spring:
  application:
    name: family-health-tracker
  output:
    ansi:
      enabled: always

  datasource:
    url: jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000

telegram:
  bot:
    name: ${TELEGRAM_BOT_NAME}
    token: ${TELEGRAM_BOT_TOKEN}
  access:
    allowed-ids: ${TELEGRAM_ALLOWED_IDS:}

app:
  parallel:
    enabled: true
  demo:
    sleep:
      enabled: true
      seconds: 30

logging:
  pattern:
    console: "%clr(%d{yyyy-MM-dd'T'HH:mm:ss.SSSXXX}){faint} %clr(%5p) %clr([%t]){faint} %clr(%logger{36}){cyan} : %m%n"
