services:
  health_tracker_db:
    image: postgres:18-alpine
    container_name: health_tracker_postgres
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    ports:
      - "${DB_PORT}:5432"
    volumes:
      - health_tracker_pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d health_tracker_db"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  health_tracker_pgdata:
